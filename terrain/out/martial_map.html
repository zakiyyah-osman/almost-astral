<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interplanetary Survival Guide: Martial Map</title>
<style>
:root {
  --bg: #120e0c;
  --panel: #1c1613;
  --panel-2: #251d19;
  --line: #3a2e28;
  --text: #f2e8df;
  --dim: #b3a398;
  --accent: #e46f3a;
  --warn-bg: #4a2a0a;
  --warn: #ffc56b;
  --radius: 10px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { display: grid; grid-template-rows: auto auto 1fr; }

.mm-header { display: flex; align-items: baseline; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mm-header h1 { font-size: 19px; margin: 0; letter-spacing: 0.01em; }
.mm-header h1 span { color: var(--accent); }
.mm-header .mm-site { color: var(--dim); font-size: 14px; }

.mm-banner { background: var(--warn-bg); color: var(--warn); padding: 8px 18px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #6b3f12; }
.mm-banner[hidden] { display: none; }

.mm-main { display: grid; grid-template-columns: 1fr 330px; min-height: 0; }
.mm-mapwrap { position: relative; min-height: 0; overflow: hidden; }
.mm-svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; user-select: none; }
.mm-svg:active { cursor: grabbing; }
.mm-svg:focus-visible { box-shadow: inset 0 0 0 3px var(--accent); }
.mm-space { fill: #0b0807; }
.mm-world image { image-rendering: auto; }
.mm-world.mm-pixelated image { image-rendering: pixelated; }
.mm-site-edge { fill: none; stroke: #f2e8df; stroke-opacity: 0.55; stroke-width: 1.5; stroke-dasharray: 6 4; }

.mm-chip { fill: rgba(18, 14, 12, 0.78); stroke: rgba(242, 232, 223, 0.25); }
.mm-north-head { fill: var(--accent); }
.mm-north-tail { fill: #f2e8df; opacity: 0.8; }
.mm-small { fill: var(--text); font-size: 13px; font-weight: 600; paint-order: stroke; stroke: rgba(0,0,0,0.6); stroke-width: 3px; }
.mm-dim { fill: var(--dim); font-weight: 400; }
.mm-sb-dark { fill: #f2e8df; }
.mm-sb-light { fill: #3a2e28; }
.mm-sb-frame { fill: none; stroke: #f2e8df; stroke-width: 1; }

.mm-grid { stroke: #fff; stroke-opacity: 0.18; stroke-width: 1; }
.mm-grid-label { fill: #fff; fill-opacity: 0.75; font-size: 11px; paint-order: stroke; stroke: rgba(0,0,0,0.7); stroke-width: 3px; }

.mm-landmark-ring { fill: none; stroke: #fff; stroke-width: 2; }
.mm-landmark-cross { stroke: #fff; stroke-width: 2; }
.mm-landmark { filter: drop-shadow(0 0 2px #000); }
.mm-landmark-label { fill: #fff; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #000; stroke-width: 3px; }

.mm-track { fill: none; stroke: #5fc3ff; stroke-width: 2.5; stroke-linejoin: round; }
.mm-route { fill: none; stroke: #ffffff; stroke-width: 2.5; stroke-dasharray: 8 5; stroke-linejoin: round; }
.mm-route-casing { fill: none; stroke: #e46f3a; stroke-width: 6; stroke-linejoin: round; opacity: 0.9; }
.mm-legend .sw-clear { background: repeating-linear-gradient(45deg, transparent 0 3px, rgba(255,255,255,0.35) 3px 4px) !important; }
.mm-track-casing { fill: none; stroke: #04121c; stroke-width: 5; stroke-linejoin: round; opacity: 0.8; }

.mm-zoom { position: absolute; z-index: 2; top: 14px; left: 14px; display: flex; flex-direction: column; gap: 6px; }
.mm-zoom button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: rgba(28,22,19,0.9); color: var(--text); font-size: 20px; cursor: pointer; }
.mm-zoom button:hover { border-color: var(--accent); }

.mm-readout { position: absolute; z-index: 2; pointer-events: none; bottom: 14px; right: 14px; background: rgba(18,14,12,0.85); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; min-width: 250px; }
.mm-readout b { color: var(--accent); font-weight: 600; }
.mm-readout .mm-dimtext { color: var(--dim); }

.mm-panel { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }
.mm-panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 8px; }
.mm-layer { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
.mm-layer label.mm-toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; cursor: pointer; min-height: 32px; }
.mm-layer input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--accent); }
.mm-layer .mm-opacity { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); margin-top: 4px; }
.mm-layer input[type="range"] { flex: 1; accent-color: var(--accent); }
.mm-layer .mm-source { font-size: 12px; color: var(--dim); margin-top: 6px; }
.mm-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12.5px; }
.mm-legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid rgba(255,255,255,0.3); }
.mm-ramp { height: 10px; border-radius: 4px; margin-top: 6px; border: 1px solid rgba(255,255,255,0.25); }
.mm-ramp-labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); }

.mm-landmarks button { display: block; width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 10px; margin-bottom: 6px; cursor: pointer; font-size: 14px; }
.mm-landmarks button:hover { border-color: var(--accent); }
.mm-landmarks button small { color: var(--dim); display: block; font-size: 12px; font-variant-numeric: tabular-nums; }

.mm-proj { font-size: 12.5px; color: var(--dim); line-height: 1.55; word-break: break-word; }
.mm-proj b { color: var(--text); font-weight: 600; }

@media (max-width: 860px) {
  .mm-main { grid-template-columns: 1fr; grid-template-rows: 62vh auto; }
  .mm-panel { border-left: 0; border-top: 1px solid var(--line); }
  .mm-readout { min-width: 0; left: 14px; right: auto; }
}

</style>
</head>
<body>
<header class="mm-header">
  <h1 id="mm-title">Interplanetary Survival Guide: Martial Map</h1>
  <div class="mm-site" id="mm-site"></div>
</header>
<div class="mm-banner" id="mm-banner" role="status" hidden></div>
<main class="mm-main">
  <div class="mm-mapwrap" id="mm-map">
    <div class="mm-zoom">
      <button id="mm-zin" aria-label="Zoom in">+</button>
      <button id="mm-zout" aria-label="Zoom out">−</button>
      <button id="mm-zfit" aria-label="Show whole site" style="font-size:15px">⤢</button>
    </div>
    <div class="mm-readout" id="mm-readout" aria-live="polite"></div>
  </div>
  <aside class="mm-panel">
    <section><h2>Layers</h2><div id="mm-layers"></div></section>
    <section><h2>Landmarks (alignment check)</h2><div class="mm-landmarks" id="mm-landmarks"></div></section>
    <section><h2>Map projection &amp; bounds</h2><div class="mm-proj" id="mm-proj"></div></section>
  </aside>
</main>

    box.innerHTML = `
      <label class="mm-toggle" for="${id}"><input id="${id}" type="checkbox" ${L.visible ? "checked" : ""}> ${L.title}</label>
      ${L.kind === "image" ? `<div class="mm-opacity">Opacity <input type="range" min="0" max="1" step="0.05" value="${L.opacity ?? 1}" aria-label="${L.title} opacity"></div>` : ""}
      ${legendHtml(L.legend, L.units)}
      ${L.source ? `<div class="mm-source">Source: ${escapeHtml(L.source)}</div>` : ""}
      ${L.note ? `<div class="mm-source">${escapeHtml(L.note)}</div>` : ""}`;
    box.querySelector("input[type=checkbox]").addEventListener("change", (e) => map.setLayerVisible(L.id, e.target.checked));
    box.querySelector("input[type=range]")?.addEventListener("input", (e) => map.setLayerOpacity(L.id, +e.target.value));
    list.appendChild(box);
  }

  function legendHtml(lg, units) {
    if (!lg) return "";
    if (lg.type === "classes") {
      return `<div class="mm-legend">${lg.items.map((it) => `<span><i class="sw${it.color === "transparent" ? " sw-clear" : ""}" style="background:${it.color}"></i>${escapeHtml(it.name)}</span>`).join("")}</div>`;
    }
    if (lg.type === "ramp") {
      const stops = (lg.css_stops || []).join(",");
      const marks = (lg.marks || []).map((m) => `${m}`).join(" · ");
      return `<div class="mm-ramp" style="background:linear-gradient(90deg,${stops})"></div>
        <div class="mm-ramp-labels"><span>${lg.min}</span><span>${marks ? "limits " + marks : ""}</span><span>${lg.max} ${units || ""}</span></div>`;
    }
    return "";
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // ---- landmarks ------------------------------------------------------------
  const lmBox = $("#mm-landmarks");
  const lm = config.layers.find((l) => l.id === "landmarks") || config.layers.find((l) => l.kind === "landmarks");
  if (lm) {
    for (const f of lm.features) {
      const b = document.createElement("button");
      b.innerHTML = `${escapeHtml(f.properties.name)}<small>${C.formatEN(f.geometry.coordinates, 1)}</small>`;
      b.addEventListener("click", () => {
        map.setLayerVisible(lm.id, true);
        $(`#chk-${lm.id}`).checked = true;
        map.flyTo(f.geometry.coordinates, Math.max(map.view.s, 3));
      });
      lmBox.appendChild(b);
    }
  } else lmBox.closest("section").hidden = true;

  // ---- projection / origin / bounds (what Person 2 shares with the team) -----
  const p = config.projection;
  $("#mm-proj").innerHTML = `
    <b>Map coordinates:</b> [east, north] m from the SW corner<br>
    <b>Bounds:</b> E 0 – ${site.width_m} m, N 0 – ${site.height_m} m · cell ${site.cell_m} m<br>
    <b>Origin (SW corner):</b> ${C.formatLatLon(site.origin_latlon)}<br>
    <b>Source projection:</b> ${escapeHtml(p.source_crs || "not set")}<br>
    <b>Origin in source projection:</b> ${p.origin_source_xy ? p.origin_source_xy.map((x) => x.toFixed(1)).join(", ") + " m" : "not set"}<br>
    <b>Leaflet CRS.Simple bounds:</b> [[0, 0], [${site.height_m}, ${site.width_m}]]`;

  // ---- zoom buttons ------------------------------------------------------------
  $("#mm-zin").addEventListener("click", () => map.zoomBy(1.5));
  $("#mm-zout").addEventListener("click", () => map.zoomBy(1 / 1.5));
  $("#mm-zfit").addEventListener("click", () => map.fit());

  window.martialMap = map; // for teammates' overlays and for debugging
})();

</script>
</body>
</html>
