# Hazard thresholds. Change them here; do not hard-code them in the scripts.
#
# IMPORTANT: these are team assumptions, NOT sourced limits. They have not been
# checked against NASA suit or rover documents. Say so in the pitch. Replace them
# with sourced values if you find any, and write the source next to the number.

[slope_deg]
yellow = 10   # careful above this slope (degrees)
red = 20      # do not enter above this slope (degrees)

[roughness]
# Roughness = RMS (metres) of how far each cell sits from the local mean height
# in a square window of `window_cells` x `window_cells` cells. A smooth slope has
# roughness 0, because slope is judged separately.
# It is a stand-in for boulders and broken rock: the terrain model has no rock
# layer, and a 5 m grid smooths out small boulders.
window_cells = 5   # odd number; 5 cells = 25 m at 5 m per cell
yellow = 0.5       # metres
red = 1.0          # metres

[thermal_inertia]
# THERMAL INERTIA UNITS: J m^-2 K^-1 s^-1/2 (SI), as in thermal_inertia.tif.
# Low thermal inertia means loose sand or dust. Starting values only: not
# checked against the real Jezero data. Absolute accuracy of THEMIS is about 20%,
# and its pixels are 100 m wide, so one pixel covers about 20 grid cells.
yellow_below = 150
red_below = 100
# Because of that coarse resolution, sand alone only ever gives yellow. A cell
# turns red from sand only when slope or roughness is already yellow there.
sand_red_needs_other_hazard = true

[missing_data]
# What to do where the terrain model has no value (NaN). Never green.
# 2 = red (do not enter), 1 = yellow. Do not use 0.
class = 2
